apply plugin: 'checkstyle'

check.dependsOn 'checkstyle'

checkstyle {
    toolVersion = "10.12.4"
}

tasks.register('checkstyle', Checkstyle) {
    configFile rootProject.file("config/style/checkstyle.xml")
    source 'src'
    include '**/*.java'
    exclude '**/gen/**'

    classpath = files()
}
