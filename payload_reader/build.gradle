plugins {
    id 'java-library'
    alias(libs.plugins.kotlin.jvm)
    id 'maven-publish'
}
apply from: rootProject.file('quality.gradle')

// 配置 sources jar 和 javadoc jar
kotlin {
    jvmToolchain(17)
}

java {
    withSourcesJar()
    withJavadocJar()
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    compileOnly libs.json.v20251224//提供org.json环境，开发时注意与Android org.json api兼容
}
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'com.github.maxZhou7'
            artifactId = 'payload_reader'
            version = VERSION_NAME
        }
    }
}
