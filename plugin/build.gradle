plugins {
    id 'groovy'
    id 'maven-publish'
    id 'java-gradle-plugin'
}
// apply from: rootProject.file('quality.gradle')

jar {
    manifest {
        attributes 'Walle-Version': VERSION_NAME
    }
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()
    implementation fileTree(dir: "./src/main/libs", include: ['*.jar'])
    implementation libs.commons.io
    implementation libs.commons.codec
    implementation libs.commons.lang3
    implementation libs.android.gradle.plugin
    implementation libs.json.v20251224
    implementation project(':payload_writer')
    implementation libs.gson
    implementation libs.guava
    implementation libs.bcpkix.jdk18on
    implementation libs.bcprov.jdk18on
}

// Configure publishing for Gradle Plugin
// java-gradle-plugin automatically creates publications, we just need to configure them
tasks.register('sourcesJar', Jar) {
    archiveClassifier.set('sources')
    from sourceSets.main.allSource
}

tasks.register('javadocJar', Jar) {
    dependsOn javadoc
    archiveClassifier.set('javadoc')
    from javadoc.destinationDir
}

// Configure the automatically created publications
afterEvaluate {
    // Configure the main plugin implementation publication (pluginMaven)
    if (publishing.publications.findByName('pluginMaven')) {
        publishing.publications.named('pluginMaven') { MavenPublication publication ->
            publication.groupId = 'com.github.maxZhou7.meituanwall'
            publication.artifactId = 'plugin'
            publication.version = VERSION_NAME
            
            // Add sources and javadoc artifacts
            artifact(tasks.named('sourcesJar').get())
            artifact(tasks.named('javadocJar').get())
            
            publication.pom {
                name = 'Walle Gradle Plugin'
                description = 'Gradle plugin for Android APK channel packaging'
                url = 'https://github.com/maxZhou7/meituanwall'
                
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                
                developers {
                    developer {
                        id = 'maxzhou'
                        name = 'maxzhou'
                        email = 'maxzhou7@gamil.com'
                    }
                }
                
                scm {
                    connection = 'scm:git:git://github.com/maxZhou7/meituanwall.git'
                    developerConnection = 'scm:git:ssh://github.com/maxZhou7/meituanwall.git'
                    url = 'https://github.com/maxZhou7/meituanwall'
                }
            }
        }
    }
    
    // Configure the plugin marker publication
    publishing.publications.withType(MavenPublication).configureEach { publication ->
        if (publication.name.contains('PluginMarker')) {
            publication.version = VERSION_NAME
        }
    }
}

// Configure Gradle Plugin Development
gradlePlugin {
    plugins {
        wallePlugin {
            id = 'com.github.maxZhou7.meituanwall'
            implementationClass = 'com.meituan.android.walle.GradlePlugin'
            displayName = 'Walle Gradle Plugin'
            description = 'Gradle plugin for Android APK channel packaging'
        }
    }
}

configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}