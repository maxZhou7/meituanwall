[versions]
# Gradle Plugin
agp = "9.0.0"
# Kotlin version is built-in to AGP 9.0 (2.2.10)
# For non-Android modules, we still need to specify a version
kotlin = "2.2.10"

# Android SDK
bcpkixJdk18on = "1.84"
bcprovJdk18on = "1.84"
compileSdk = "34"
jsonVersion = "20251224"
targetSdk = "34"
minSdk = "21"
buildTools = "34.0.0"

# Java
javaVersion = "17"

# AndroidX
appcompat = "1.6.1"
material = "1.11.0"
annotation = "1.7.1"

# Commons
commons-io = "2.15.1"
commons-codec = "1.16.0"
commons-lang3 = "3.14.0"
guava = "32.1.3-jre"

# JSON & Gson
gson = "2.10.1"

# CLI Tools
jcommander = "1.82"
shadow = "8.1.1"

# Testing
junit = "4.13.2"

[libraries]
# Android Gradle Plugin
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }

# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

# AndroidX
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }

# Commons
bcprov-jdk18on = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bcprovJdk18on" }
bcpkix-jdk18on = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bcpkixJdk18on" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
commons-codec = { module = "commons-codec:commons-codec", version.ref = "commons-codec" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }

# JSON & Gson
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# CLI Tools
jcommander = { module = "com.beust:jcommander", version.ref = "jcommander" }

# Testing
json-v20251224 = { module = "org.json:json", version.ref = "jsonVersion" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.github.johnrengelman.shadow", version.ref = "shadow" }
