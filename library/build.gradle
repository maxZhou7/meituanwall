plugins {
    alias(libs.plugins.android.library)
    id 'maven-publish'
}

apply from: rootProject.file('quality.gradle')

android {
    namespace 'com.meituan.android.walle'
    compileSdk rootProject.ext.compileSdkVersion


    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        // 消费者规则（如果需要）
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    lintOptions {
        quiet true
        warningsAsErrors true
        disable 'GradleDependency'
    }

    // 生成 sources jar 和 javadoc jar
    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                // 坐标信息
                groupId = 'com.github.maxZhou7'
                artifactId = 'walle'
                version = '2.0.20'

                pom {
                    name = 'Walle Library'
                    description = 'Android APK Signature V2 Scheme channel reader and writer'
                    url = 'https://github.com/maxZhou7/meituanwall'

                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }

                    developers {
                        developer {
                            id = 'maxzhou'
                            name = 'maxzhou'
                            email = 'maxzhou7@gamil.com'
                        }
                    }

                    scm {
                        connection = 'scm:git:git://github.com/maxZhou7/meituanwall.git'
                        developerConnection = 'scm:git:ssh://github.com/maxZhou7/meituanwall.git'
                        url = 'https://github.com/maxZhou7/meituanwall'
                    }
                }
            }
        }
    }
}
configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation libs.androidx.annotation
    api project(':payload_reader')
}